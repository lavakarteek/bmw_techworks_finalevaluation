[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-vehicle-alert"
version = "0.1.0"
description = "BMW connected vehicle overheating and critical fault alert service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]